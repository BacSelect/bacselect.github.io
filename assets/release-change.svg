        <circle cx="1002" cy="199" r="8.5"/>
        <circle cx="1042" cy="194" r="8.5"/>
        <circle cx="1081" cy="207" r="8.5"/>

        <circle cx="893" cy="240" r="8.5"/>
        <circle cx="933" cy="232" r="8.5"/>
        <circle cx="975" cy="244" r="8.5"/>
        <circle cx="1016" cy="232" r="8.5"/>
        <circle cx="1056" cy="253" r="11.5"/>
        <circle cx="1094" cy="246" r="8.5"/>

        <circle cx="886" cy="284" r="8.5"/>
        <circle cx="925" cy="279" r="8.5"/>
        <circle cx="966" cy="292" r="8.5"/>
        <circle cx="1006" cy="281" r="8.5"/>
        <circle cx="1046" cy="294" r="8.5"/>
        <circle cx="1086" cy="286" r="8.5"/>
        <circle cx="1115" cy="303" r="8.5"/>

        <circle cx="889" cy="329" r="8.5"/>
        <circle cx="944" cy="334" r="11.5"/>
        <circle cx="980" cy="325" r="8.5"/>
        <circle cx="1020" cy="337" r="8.5"/>
        <circle cx="1062" cy="325" r="8.5"/>
        <circle cx="1101" cy="342" r="8.5"/>

        <circle cx="898" cy="374" r="8.5"/>
        <circle cx="938" cy="365" r="8.5"/>
        <circle cx="979" cy="378" r="8.5"/>
        <circle cx="1019" cy="368" r="8.5"/>
        <circle cx="1060" cy="381" r="8.5"/>
        <circle cx="1094" cy="373" r="8.5"/>

        <circle cx="916" cy="416" r="8.5"/>
        <circle cx="957" cy="425" r="8.5"/>
        <circle cx="998" cy="415" r="8.5"/>
        <circle cx="1043" cy="409" r="11.5"/>
        <circle cx="1080" cy="421" r="8.5"/>

        <!-- formerly selected: now ordinary grey -->
        <circle cx="940" cy="454" r="8.5"/>
        <circle cx="983" cy="462" r="8.5"/>
        <circle cx="1025" cy="452" r="8.5"/>
        <circle cx="1067" cy="459" r="8.5"/>

        <!-- newly eligible -->
        <circle cx="1083" cy="135" r="10"/>
        <circle cx="905" cy="258" r="10"/>
        <circle cx="1110" cy="318" r="10"/>
        <circle cx="918" cy="393" r="10"/>

