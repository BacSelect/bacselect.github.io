      This prevents purple lines showing through semi-transparent
      eligible genomes.
    -->
    <mask
      id="hide-lines-under-points"
      maskUnits="userSpaceOnUse"
      maskContentUnits="userSpaceOnUse"
      x="0"
      y="0"
      width="1260"
      height="650"
      style="mask-type:luminance"
    >
      <rect x="0" y="0" width="1260" height="650" fill="white"/>

      <g fill="black">

        <!-- Release A universe -->
        <circle cx="566" cy="156" r="8.5"/>
        <circle cx="606" cy="144" r="8.5"/>
        <circle cx="647" cy="151" r="8.5"/>
        <circle cx="687" cy="164" r="8.5"/>

        <circle cx="540" cy="196" r="8.5"/>
        <circle cx="596" cy="185" r="11.5"/>
        <circle cx="632" cy="199" r="8.5"/>
        <circle cx="672" cy="194" r="8.5"/>
        <circle cx="711" cy="207" r="8.5"/>

        <circle cx="523" cy="240" r="8.5"/>
        <circle cx="563" cy="232" r="8.5"/>
        <circle cx="605" cy="244" r="8.5"/>
        <circle cx="646" cy="232" r="8.5"/>
        <circle cx="686" cy="253" r="11.5"/>
        <circle cx="724" cy="246" r="8.5"/>

        <circle cx="516" cy="284" r="8.5"/>
        <circle cx="555" cy="279" r="8.5"/>
        <circle cx="596" cy="292" r="8.5"/>
        <circle cx="636" cy="281" r="8.5"/>
        <circle cx="676" cy="294" r="8.5"/>
        <circle cx="716" cy="286" r="8.5"/>
        <circle cx="745" cy="303" r="8.5"/>

        <circle cx="519" cy="329" r="8.5"/>
        <circle cx="574" cy="334" r="11.5"/>
        <circle cx="610" cy="325" r="8.5"/>
        <circle cx="650" cy="337" r="8.5"/>
        <circle cx="692" cy="325" r="8.5"/>
        <circle cx="731" cy="342" r="8.5"/>

        <circle cx="528" cy="374" r="8.5"/>
        <circle cx="568" cy="365" r="8.5"/>
        <circle cx="609" cy="378" r="8.5"/>
        <circle cx="649" cy="368" r="8.5"/>
        <circle cx="690" cy="381" r="8.5"/>
        <circle cx="724" cy="373" r="8.5"/>

        <circle cx="546" cy="416" r="8.5"/>
        <circle cx="587" cy="425" r="8.5"/>
        <circle cx="628" cy="415" r="8.5"/>
        <circle cx="673" cy="409" r="11.5"/>
        <circle cx="710" cy="421" r="8.5"/>

        <circle cx="570" cy="454" r="8.5"/>
        <circle cx="613" cy="462" r="11.5"/>
        <circle cx="655" cy="452" r="8.5"/>
        <circle cx="697" cy="459" r="8.5"/>

        <!-- Release A panel -->
        <circle cx="807" cy="226" r="10.5"/>
        <circle cx="807" cy="286" r="10.5"/>
        <circle cx="807" cy="346" r="10.5"/>
        <circle cx="807" cy="406" r="10.5"/>
        <circle cx="807" cy="466" r="10.5"/>


