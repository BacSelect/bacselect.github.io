<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1260 650"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Release change</title>
  <desc id="desc">
    BacSelect recomputes its deterministic ranking when the eligible genome
    universe changes between releases. A genome selected in one release may
    drop from the panel when newly eligible genomes alter the ranking.
  </desc>

  <defs>
    <style>
      .primary {
        fill: #141717;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .secondary {
        fill: #7f8683;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .eligible {
        fill: #7f8683;
        opacity: .52;
      }

      .selected {
        fill: #5b5cf0;
      }

      .new-eligible {
        fill: #7f8683;
        fill-opacity: .52;
        stroke: #8d8df8;
        stroke-width: 2.6;
      }

      .new-selected {
        fill: #5b5cf0;
        stroke: #8d8df8;
        stroke-width: 2.8;
      }

      .guide {
        fill: none;
        stroke: #8d8df8;
        stroke-width: 1.6;
        stroke-linecap: round;
        opacity: .45;
      }

      .boundary {
        fill: none;
        stroke: #7f8683;
        stroke-width: 1.3;
        stroke-dasharray: 5 7;
        opacity: .28;
      }

      .panel-box {
        fill: none;
        stroke: #8d8df8;
        stroke-width: 1.8;
      }
    </style>

    <marker
      id="arrowhead"
      markerWidth="9"
      markerHeight="9"
      refX="7.5"
      refY="4.5"
      orient="auto"
    >
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8d8df8"/>
    </marker>

