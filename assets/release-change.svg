<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Change between BacSelect monthly releases</title>
  <desc id="desc">
    Two monthly bacterial genome universes are compared, showing retained,
    entering and leaving genomes and the corresponding change in selected
    panel membership.
  </desc>

  <g
    font-family="Inter,Segoe UI,sans-serif"
  >
    <text x="90" y="75" fill="#141717" font-size="20" font-weight="700">
      Previous release
    </text>
    <text x="810" y="75" fill="#141717" font-size="20" font-weight="700">
      Current release
    </text>
  </g>

  <g
    fill="none"
    stroke="#d4d0c6"
    stroke-width="2"
  >
    <rect x="70" y="105" width="330" height="310" rx="28"/>
    <rect x="800" y="105" width="330" height="310" rx="28"/>
  </g>

  <g fill="#8b918f" opacity=".58">
    <circle cx="125" cy="175" r="8"/>
    <circle cx="177" cy="212" r="8"/>
    <circle cx="236" cy="164" r="8"/>
    <circle cx="298" cy="218" r="8"/>
    <circle cx="338" cy="164" r="8"/>
    <circle cx="146" cy="290" r="8"/>
    <circle cx="211" cy="321" r="8"/>
    <circle cx="282" cy="278" r="8"/>
    <circle cx="342" cy="342" r="8"/>

    <circle cx="855" cy="175" r="8"/>
    <circle cx="907" cy="212" r="8"/>
    <circle cx="966" cy="164" r="8"/>
    <circle cx="1028" cy="218" r="8"/>
    <circle cx="1068" cy="164" r="8"/>
    <circle cx="876" cy="290" r="8"/>
    <circle cx="941" cy="321" r="8"/>
    <circle cx="1012" cy="278" r="8"/>
    <circle cx="1072" cy="342" r="8"/>
  </g>

  <g fill="#5b5cf0">
    <circle cx="177" cy="212" r="12"/>
    <circle cx="298" cy="218" r="12"/>
    <circle cx="211" cy="321" r="12"/>

    <circle cx="907" cy="212" r="12"/>
    <circle cx="1028" cy="218" r="12"/>
    <circle cx="941" cy="321" r="12"/>
    <circle cx="1090" cy="250" r="12"/>
  </g>

  <g
    stroke="#141717"
    stroke-width="2"
    fill="none"
  >
    <path d="M445 260 L752 260"/>
  </g>

  <g
    font-family="Inter,Segoe UI,sans-serif"
    text-anchor="middle"
  >
    <text x="598" y="207" fill="#141717" font-size="16" font-weight="700">
      What changed?
    </text>
    <text x="598" y="236" fill="#6d7371" font-size="14">
      genomes in / out
    </text>
    <text x="598" y="260" fill="#6d7371" font-size="14">
      species groups in / out
    </text>
    <text x="598" y="284" fill="#6d7371" font-size="14">
      panel membership by N
    </text>
    <text x="598" y="308" fill="#6d7371" font-size="14">
      structural-distance change
    </text>
  </g>
</svg>
