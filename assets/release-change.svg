  <!-- =========================================================
       LEFT: explanation
       ========================================================= -->

  <text
    x="45"
    y="72"
    class="primary"
    font-size="40"
    font-weight="700"
  >
    Release
    <tspan fill="#5b5cf0"> change</tspan>
  </text>

  <text
    x="45"
    y="125"
    class="secondary"
    font-size="21"
  >
    A new release can change the eligible universe
  </text>

  <text
    x="45"
    y="156"
    class="secondary"
    font-size="21"
  >
    and therefore the deterministic ranking.
  </text>


  <!-- Legend -->

  <circle cx="67" cy="238" r="12" class="eligible"/>

  <text
    x="96"
    y="245"
    class="primary"
    font-size="20"
  >
    Eligible genome
  </text>


  <circle cx="67" cy="301" r="12" class="selected"/>

  <text
    x="96"
    y="308"
    class="primary"
    font-size="20"
  >
    Selected (panel) genome
  </text>


  <circle cx="67" cy="364" r="11" class="new-eligible"/>

  <text
    x="96"
    y="371"
    class="primary"
    font-size="20"
  >
    Newly eligible genome
  </text>


  <!-- Callout -->

  <rect
    x="45"
    y="432"
    width="390"
    height="100"
    rx="14"
    fill="none"
    stroke="#8d8df8"
    stroke-width="1.8"
  />

  <text
    x="72"
    y="472"
    fill="#5b5cf0"
    font-family="Inter, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="700"
