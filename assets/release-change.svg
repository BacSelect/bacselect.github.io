    <circle cx="574" cy="334" r="11" class="selected"/>
    <circle cx="610" cy="325" r="8" class="eligible"/>
    <circle cx="650" cy="337" r="8" class="eligible"/>
    <circle cx="692" cy="325" r="8" class="eligible"/>
    <circle cx="731" cy="342" r="8" class="eligible"/>

