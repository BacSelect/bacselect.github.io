        <circle cx="640" cy="242" r="8.5"/>
        <circle cx="661" cy="351" r="8.5"/>
        <circle cx="578" cy="366" r="8.5"/>
        <circle cx="610" cy="306" r="11.5"/>

        <!-- Cluster 3 -->
        <circle cx="867" cy="190" r="8.5"/>
        <circle cx="870" cy="286" r="8.5"/>
        <circle cx="959" cy="194" r="8.5"/>
        <circle cx="919" cy="240" r="11.5"/>

        <!-- Cluster 4 -->
        <circle cx="1160" cy="127" r="8.5"/>
        <circle cx="1170" cy="205" r="8.5"/>
        <circle cx="1110" cy="176" r="11.5"/>

