        <circle cx="673" cy="549" r="8.5"/>
        <circle cx="744" cy="565" r="8.5"/>
        <circle cx="803" cy="524" r="8.5"/>
        <circle cx="716" cy="503" r="11.5"/>

        <!-- Cluster 6 -->
