  <!-- =========================================================
       LEFT: explanation
       ========================================================= -->

  <text
    x="45"
    y="72"
    class="primary"
    font-size="40"
    font-weight="700"
  >
    Nearest-panel
    <tspan fill="#8d8df8"> distance</tspan>
  </text>

  <text
    x="45"
    y="125"
    class="secondary"
    font-size="21"
  >
    Each eligible genome is measured
  </text>

  <text
    x="45"
    y="156"
    class="secondary"
    font-size="21"
  >
    against its nearest selected genome.
  </text>


