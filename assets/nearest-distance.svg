<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1260 650"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Nearest-panel distance</title>
  <desc id="desc">
    Eligible genomes are connected to their nearest selected BacSelect
    panel genome. Shorter distances indicate denser representation.
  </desc>

  <defs>
    <style>
      .primary {
        fill: #f7f5ee;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .secondary {
        fill: #aeb5b3;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .eligible {
        fill: #7f8683;
        opacity: .65;
      }

      .selected {
        fill: #5b5cf0;
      }

      .distance {
        fill: none;
        stroke: #8d8df8;
        stroke-width: 1.8;
        stroke-linecap: round;
        opacity: .9;
      }
    </style>

    <!--
      Prevent distance lines from showing through genome dots.
      The lines remain behind the points even though eligible
      genomes are semi-transparent.
    -->
    <mask
      id="hide-lines-under-genomes"
      maskUnits="userSpaceOnUse"
      maskContentUnits="userSpaceOnUse"
      x="0"
      y="0"
      width="1260"
      height="650"
      style="mask-type:luminance"
    >
      <rect x="0" y="0" width="1260" height="650" fill="white"/>

      <g fill="black">

        <!-- Cluster 1 -->
        <circle cx="646" cy="105" r="8.5"/>
        <circle cx="674" cy="72"  r="8.5"/>
        <circle cx="754" cy="78"  r="8.5"/>
        <circle cx="770" cy="132" r="8.5"/>
        <circle cx="756" cy="184" r="8.5"/>
        <circle cx="704" cy="143" r="11.5"/>

        <!-- Cluster 2 -->
