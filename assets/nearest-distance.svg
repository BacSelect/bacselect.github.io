        <circle cx="1038" cy="556" r="8.5"/>
        <circle cx="1088" cy="574" r="8.5"/>
        <circle cx="1148" cy="552" r="8.5"/>
        <circle cx="1172" cy="459" r="8.5"/>
        <circle cx="1119" cy="430" r="8.5"/>
        <circle cx="1076" cy="500" r="11.5"/>

