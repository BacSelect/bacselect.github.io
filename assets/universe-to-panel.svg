<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 610"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">From public genome archive to BacSelect panel</title>
  <desc id="desc">
    An uneven public complete-genome archive is represented in
    species-balanced genome-architecture space and reduced to a compact,
    deterministic BacSelect panel.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 L10 5 L0 10 z" fill="#5b5cf0"/>
    </marker>
  </defs>

  <g fill="none" stroke="#d4d0c6" stroke-width="2">
    <rect x="42" y="70" width="330" height="430" rx="28"/>
    <rect x="435" y="70" width="330" height="430" rx="28"/>
    <rect x="828" y="70" width="330" height="430" rx="28"/>
  </g>

  <g
    fill="#141717"
    font-family="Inter,Segoe UI,sans-serif"
    text-anchor="middle"
  >
    <text x="207" y="112" font-size="18" font-weight="700">
      Public complete-genome universe
    </text>
    <text x="600" y="112" font-size="18" font-weight="700">
      Architecture space
    </text>
    <text x="993" y="112" font-size="18" font-weight="700">
      BacSelect panel
    </text>
  </g>

  <!-- Uneven archive -->
  <g fill="#9ca29f" opacity=".63">
    <circle cx="113" cy="206" r="8"/>
    <circle cx="139" cy="190" r="7"/>
    <circle cx="164" cy="216" r="8"/>
    <circle cx="190" cy="197" r="7"/>
    <circle cx="216" cy="225" r="8"/>
    <circle cx="128" cy="244" r="7"/>
    <circle cx="160" cy="255" r="8"/>
    <circle cx="196" cy="263" r="7"/>
    <circle cx="230" cy="252" r="8"/>
    <circle cx="107" cy="282" r="7"/>
    <circle cx="143" cy="300" r="8"/>
    <circle cx="180" cy="291" r="7"/>
    <circle cx="218" cy="309" r="8"/>
    <circle cx="250" cy="289" r="7"/>
    <circle cx="124" cy="339" r="7"/>
    <circle cx="171" cy="349" r="8"/>
    <circle cx="218" cy="355" r="7"/>
    <circle cx="268" cy="342" r="8"/>

    <circle cx="84" cy="163" r="7"/>
    <circle cx="292" cy="180" r="7"/>
    <circle cx="318" cy="245" r="7"/>
    <circle cx="87" cy="396" r="7"/>
    <circle cx="299" cy="405" r="7"/>
  </g>

  <path
    d="M388 286 L419 286"
    fill="none"
    stroke="#5b5cf0"
    stroke-width="3"
    marker-end="url(#arrow)"
  />

  <!-- Balanced architecture space -->
  <g stroke="#d4d0c6" stroke-width="1.5">
    <line x1="490" y1="412" x2="712" y2="412"/>
    <line x1="490" y1="412" x2="490" y2="164"/>
  </g>

  <g fill="#9ca29f" opacity=".68">
    <circle cx="520" cy="382" r="7"/>
    <circle cx="552" cy="351" r="7"/>
    <circle cx="588" cy="375" r="7"/>
    <circle cx="623" cy="328" r="7"/>
    <circle cx="664" cy="356" r="7"/>
    <circle cx="698" cy="310" r="7"/>
    <circle cx="530" cy="293" r="7"/>
    <circle cx="574" cy="269" r="7"/>
    <circle cx="623" cy="278" r="7"/>
    <circle cx="674" cy="239" r="7"/>
    <circle cx="544" cy="221" r="7"/>
    <circle cx="598" cy="198" r="7"/>
    <circle cx="652" cy="183" r="7"/>
    <circle cx="706" cy="153" r="7"/>
  </g>

  <path
    d="M781 286 L812 286"
    fill="none"
    stroke="#5b5cf0"
    stroke-width="3"
    marker-end="url(#arrow)"
  />

  <!-- Selected panel -->
  <g fill="#5b5cf0">
    <circle cx="878" cy="383" r="10"/>
    <circle cx="924" cy="345" r="10"/>
    <circle cx="986" cy="374" r="10"/>
    <circle cx="1075" cy="329" r="10"/>
    <circle cx="891" cy="279" r="10"/>
    <circle cx="978" cy="265" r="10"/>
    <circle cx="1092" cy="239" r="10"/>
    <circle cx="927" cy="204" r="10"/>
    <circle cx="1024" cy="188" r="10"/>
    <circle cx="1107" cy="151" r="10"/>
  </g>

  <g
    stroke="#c4c1ff"
    stroke-width="1.6"
    opacity=".8"
  >
    <line x1="878" y1="383" x2="924" y2="345"/>
    <line x1="924" y1="345" x2="986" y2="374"/>
    <line x1="986" y1="374" x2="1075" y2="329"/>
    <line x1="891" y1="279" x2="978" y2="265"/>
    <line x1="978" y1="265" x2="1092" y2="239"/>
    <line x1="927" y1="204" x2="1024" y2="188"/>
    <line x1="1024" y1="188" x2="1107" y2="151"/>
  </g>

  <g
    font-family="Inter,Segoe UI,sans-serif"
    font-size="16"
    font-weight="650"
    text-anchor="middle"
  >
    <text x="207" y="465" fill="#6d7371">
      Uneven archive
    </text>
    <text x="600" y="465" fill="#6d7371">
      Species-balanced space
    </text>
    <text x="993" y="465" fill="#5b5cf0">
      Compact deterministic panel
    </text>
  </g>
</svg>
