    y="125"
    class="secondary"
    font-size="21"
  >
    Start with eligible public complete genomes.
  </text>

  <text
    x="45"
    y="156"
    class="secondary"
    font-size="21"
  >
    Rank genomes to span genome architecture.
  </text>


