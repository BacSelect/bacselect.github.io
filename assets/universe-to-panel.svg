       ========================================================= -->

  <ellipse
    cx="735"
    cy="318"
    rx="248"
    ry="260"
    class="boundary"
  />


  <!--
    Six representative guide lines correspond directly
    to ranks 1–6 in the panel.

    They are deliberately faint, drawn behind the points,
    and masked beneath every grey and purple genome.
  -->

  <g
    id="ranking-lines"
    mask="url(#hide-lines-under-genomes)"
  >
    <!-- rank 1 -->
    <path
      d="M771 90
         C900 108 997 145 1112 205"
      class="ranking-line"
    />

    <!-- rank 2 -->
    <path
      d="M580 159
         C770 166 958 192 1112 255"
      class="ranking-line"
    />

    <!-- rank 3 -->
    <path
      d="M903 231
         C982 238 1048 264 1112 305"
      class="ranking-line"
    />

    <!-- rank 4 -->
    <path
      d="M637 249
         C810 278 974 318 1112 355"
      class="ranking-line"
    />

    <!-- rank 5 -->
