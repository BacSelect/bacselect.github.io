      .primary {
        fill: #141717;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .secondary {
        fill: #7f8683;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .eligible {
        fill: #7f8683;
        opacity: .52;
      }

      .selected {
        fill: #5b5cf0;
      }

      .ranking-line {
        fill: none;
        stroke: #8d8df8;
        stroke-width: 1.7;
        stroke-linecap: round;
        opacity: .45;
      }

      .boundary {
        fill: none;
        stroke: #7f8683;
        stroke-width: 1.3;
        stroke-dasharray: 5 7;
        opacity: .28;
      }
    </style>

