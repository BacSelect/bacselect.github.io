<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1260 650"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Universe to panel</title>
  <desc id="desc">
    BacSelect starts from eligible public complete bacterial genomes,
    ranks representative genomes to span genome architecture,
    and the first N genomes form the selected panel.
  </desc>

  <defs>
